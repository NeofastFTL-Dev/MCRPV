name: build

# The `linux` branch is the native Rust/egui app: no .NET, no WPF, no Wine prefix and no Windows
# targeting pack. CI builds and tests it on Linux and uploads the binary as an artifact.
on:
  push:
    branches: [linux, macos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: GUI libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      - name: Self-test
        run: ./target/release/mcrpv --selftest

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Check the binary
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/mcrpv)
          echo "$ftype"
          case "$ftype" in
            *ELF*) ;;
            *) echo "not a Linux ELF binary"; exit 1 ;;
          esac
          size=$(stat -c %s target/release/mcrpv)
          test "$size" -gt 1000000 || { echo "binary is only $size bytes"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mcrpv-linux-x86_64
          path: rust/target/release/mcrpv
          if-no-files-found: error

  macos:
    name: macOS build + tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      - name: Self-test
        run: ./target/release/mcrpv --selftest

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Check the binary
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/mcrpv)
          echo "$ftype"
          case "$ftype" in
            *Mach-O*) ;;
            *) echo "not a Mach-O binary"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: mcrpv-macos
          path: rust/target/release/mcrpv
          if-no-files-found: error
