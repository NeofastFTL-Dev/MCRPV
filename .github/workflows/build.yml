name: build

# build-wine.sh needs Wine plus a Windows .NET SDK inside the prefix, which a Linux
# runner does not have. The publish it produces (Release / win-x64 / self-contained /
# single file) is reproducible on Linux with EnableWindowsTargeting - WPF included -
# so CI builds that and checks the result really is a Windows PE, not an assumption.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Publish win-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet publish (Release, win-x64, self-contained, single file)
        run: |
          set -euo pipefail
          dotnet publish MCRPV/MCRPV.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableWindowsTargeting=true \
            -o out

      - name: Check the published exe
        run: |
          set -euo pipefail
          exe='out/MCRPV.exe'
          test -f "$exe" || { echo "the exe was not produced"; ls -l out; exit 1; }
          ls -lh "$exe"
          ftype=$(file -b "$exe")
          echo "file type: $ftype"
          case "$ftype" in
            *PE32+*) ;;
            *) echo "$exe is not a PE32+ Windows binary"; exit 1 ;;
          esac
          size=$(stat -c %s "$exe")
          test "$size" -gt 1000000 \
            || { echo "$exe is only $size bytes - the self-contained runtime is missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mcrpv-win-x64
          path: out/*
          if-no-files-found: error

  linux-port:
    name: Linux build (linux branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux
          path: src

      - name: GUI libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        working-directory: src/rust
        run: cargo build --release --locked

      - name: Check the binary
        working-directory: src/rust
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/mcrpv)
          echo "$ftype"
          case "$ftype" in
            *ELF*) ;;
            *) echo "not a Linux ELF binary"; exit 1 ;;
          esac

      - name: Name the binary after its own version
        working-directory: src/rust
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          cp target/release/mcrpv "mcrpv-${version}-linux-x86_64"
          ls -l "mcrpv-${version}-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: mcrpv-rust-linux
          path: src/rust/mcrpv-*
          if-no-files-found: error

  macos-port:
    name: macOS build (macos branch)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos
          path: src

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        working-directory: src/rust
        run: cargo build --release --locked

      - name: Check the binary
        working-directory: src/rust
        run: |
          set -euo pipefail
          ftype=$(file -b target/release/mcrpv)
          echo "$ftype"
          case "$ftype" in
            *Mach-O*) ;;
            *) echo "not a macOS Mach-O binary"; exit 1 ;;
          esac

      - name: Name the binary after its own version
        working-directory: src/rust
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          cp target/release/mcrpv "mcrpv-${version}-macos"
          ls -l "mcrpv-${version}-macos"

      - uses: actions/upload-artifact@v4
        with:
          name: mcrpv-rust-macos
          path: src/rust/mcrpv-*
          if-no-files-found: error

  release:
    name: Release
    needs: [windows-x64, linux-port, macos-port]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcrpv-win-x64
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: mcrpv-rust-linux
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: mcrpv-rust-macos
          path: dist/macos

      - name: Collect every build for this tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          test -s dist/win/MCRPV.exe
          (cd dist/win && zip -9 "../../out/MCRPV-${version}-win-x64.zip" ./*)
          cp dist/linux/mcrpv-* out/
          cp dist/macos/mcrpv-* out/
          chmod 755 out/mcrpv-*
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: MCRPV ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Every build of MCRPV for this tag:

            * `MCRPV-<tag>-win-x64.zip` - the WPF app from `main`, self-contained single file:
              unzip it anywhere and run `MCRPV.exe`. `recipes.json` next to it is the bundled
              sample.
            * `mcrpv-<version>-linux-x86_64` and `mcrpv-<version>-macos` - the native Rust/egui
              port from the `linux` and `macos` branches, at that port's own version. It covers the
              recipe tree, the base to end plan, the machine picker, recipe layers, search,
              languages and settings; JEI bookmarks, the shopping list, the pack index and the PNG
              export are still only in the WPF app.
