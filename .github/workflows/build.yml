name: build

# build-wine.sh needs Wine plus a Windows .NET SDK inside the prefix, which a Linux
# runner does not have. The publish it produces (Release / win-x64 / self-contained /
# single file) is reproducible on Linux with EnableWindowsTargeting - WPF included -
# so CI builds that and checks the result really is a Windows PE, not an assumption.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Publish win-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet publish (Release, win-x64, self-contained, single file)
        run: |
          set -euo pipefail
          dotnet publish MCRPV/MCRPV.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:EnableWindowsTargeting=true \
            -o out

      - name: Check the published exe
        run: |
          set -euo pipefail
          exe='out/MCRPV.exe'
          test -f "$exe" || { echo "the exe was not produced"; ls -l out; exit 1; }
          ls -lh "$exe"
          ftype=$(file -b "$exe")
          echo "file type: $ftype"
          case "$ftype" in
            *PE32+*) ;;
            *) echo "$exe is not a PE32+ Windows binary"; exit 1 ;;
          esac
          size=$(stat -c %s "$exe")
          test "$size" -gt 1000000 \
            || { echo "$exe is only $size bytes - the self-contained runtime is missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: mcrpv-win-x64
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    needs: windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcrpv-win-x64
          path: dist

      - name: Package the exe with its recipes.json
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -s dist/MCRPV.exe
          (cd dist && zip -9 "../MCRPV-${version}-win-x64.zip" ./*)
          ls -l "MCRPV-${version}-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: MCRPV-*.zip
          name: MCRPV ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Windows x86_64 WPF build: self-contained single file, so no .NET runtime has to be
            installed. Unzip it somewhere and run `MCRPV.exe`; `recipes.json` next to it is the
            bundled sample. The app also reads a JEIExporter dump or a Minecraft instance, as the
            README describes.
