[package]
name = "mcrpv"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Minecraft Recipe Tree Viewer — Rust/egui port"
license = "MIT"

[[bin]]
name = "mcrpv"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
strip = true
